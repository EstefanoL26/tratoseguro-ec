# Las pruebas usan una base en memoria creada por las mismas migraciones de Flyway
spring.datasource.url=jdbc:h2:mem:pruebas;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

tratoseguro.admin.password=admin123
# Sin claves: las pruebas usan el pago simulado
stripe.secret-key=
stripe.webhook-secret=
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.path=/swagger-ui.html
# Sin claves: las pruebas no mandan correos ni push
correo.brevo-api-key=
correo.remitente=
push.vapid-public-key=
push.vapid-private-key=
