# Perfil "prod": lo activa Render con SPRING_PROFILES_ACTIVE=prod
# La base es PostgreSQL de Render; los datos de conexión llegan como variables de entorno (ver render.yaml)
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# En el servidor las plantillas no cambian, así que se guardan en caché
spring.thymeleaf.cache=true
