spring.application.name=tratoseguro
# Render indica el puerto con la variable PORT; en local se usa 8080
server.port=${PORT:8080}
# Render pone la app detrás de un proxy HTTPS: así las URL de retorno de Stripe salen con https
server.forward-headers-strategy=framework

# Base de datos H2 guardada en archivo (./data/tratoseguro.mv.db), no se borra al reiniciar
spring.datasource.url=jdbc:h2:file:./data/tratoseguro
spring.datasource.username=sa
spring.datasource.password=

# El esquema lo crean las migraciones de Flyway (src/main/resources/db/migration).
# Hibernate solo valida que las entidades coincidan con las tablas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
# La base antigua (creada por Hibernate) no tenía historial de Flyway: se toma como versión 0
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.thymeleaf.cache=false

# Contraseña del admin que se crea la primera vez. En el servidor se cambia con la variable ADMIN_PASSWORD
tratoseguro.admin.password=${ADMIN_PASSWORD:admin123}

# Stripe en modo de prueba. Sin estas variables, la app usa el pago simulado.
# Nunca escribas las claves aquí: van como variables de entorno (en Render: Environment).
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
