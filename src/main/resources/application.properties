spring.application.name=tratoseguro
# Render indica el puerto con la variable PORT; en local se usa 8080
server.port=${PORT:8080}
# Render pone la app detrás de un proxy HTTPS: así las URL de retorno de Stripe salen con https
server.forward-headers-strategy=framework

# Base de datos H2 guardada en archivo (./data/tratoseguro.mv.db), no se borra al reiniciar
spring.datasource.url=jdbc:h2:file:./data/tratoseguro
spring.datasource.username=sa
spring.datasource.password=

# El esquema lo crean las migraciones de Flyway (src/main/resources/db/migration).
# Hibernate solo valida que las entidades coincidan con las tablas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
# La base antigua (creada por Hibernate) no tenía historial de Flyway: se toma como versión 0
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.thymeleaf.cache=false
# La app siempre se muestra en español de Ecuador (fechas como "jueves 08/10/2026")
spring.web.locale=es_EC
spring.web.locale-resolver=fixed

# Contraseña del admin que se crea la primera vez. En el servidor se cambia con la variable ADMIN_PASSWORD
tratoseguro.admin.password=${ADMIN_PASSWORD:admin123}

# Stripe en modo de prueba. Sin estas variables, la app usa el pago simulado.
# Nunca escribas las claves aquí: van como variables de entorno (en Render: Environment).
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

# Evidencia con archivos: el servicio acepta hasta 5 MB (fotos JPG, PNG, WebP o PDF).
# El servidor deja pasar hasta 10 MB para que un archivo un poco más grande reciba un mensaje claro
# en lugar de un error genérico.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Swagger UI: documenta solo la API REST (/api/**)
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# Dirección pública de la app (para los enlaces de los correos). En Render: https://tratoseguro-ec.onrender.com
tratoseguro.url=${APP_URL:http://localhost:8080}

# Correos con la API de Brevo (Render gratis bloquea SMTP). Sin estas variables no se envían correos.
# CORREO_REMITENTE debe ser un remitente verificado en Brevo. Nunca escribas la clave aquí.
correo.brevo-api-key=${BREVO_API_KEY:}
correo.remitente=${CORREO_REMITENTE:}

# Notificaciones push al celular (Web Push). Sin las claves VAPID quedan apagadas.
# La clave privada es secreta: solo va como variable de entorno.
push.vapid-public-key=${VAPID_PUBLIC_KEY:}
push.vapid-private-key=${VAPID_PRIVATE_KEY:}
push.vapid-subject=${VAPID_SUBJECT:mailto:soporte@tratoseguro.ec}

# El manifiesto de la app instalable debe servirse con su tipo correcto
server.mime-mappings.webmanifest=application/manifest+json
