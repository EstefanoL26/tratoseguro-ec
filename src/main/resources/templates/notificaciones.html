<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/base :: head('Notificaciones')}"></head>
<body>

<nav th:replace="~{fragmentos/base :: navbar('notificaciones')}"></nav>

<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <th:block th:replace="~{fragmentos/base :: alertas}"></th:block>

            <div class="encabezado-pagina">
                <div>
                    <h1 class="titulo mb-0">Notificaciones</h1>
                    <p class="subtitulo mb-0">Avisos internos de tus tratos (no se envían correos ni SMS).</p>
                </div>
                <form th:if="${notificacionesNoLeidas > 0}" th:action="@{/notificaciones/leidas}" method="post">
                    <button type="submit" class="btn btn-outline-primary"><i class="bi bi-check2-all" aria-hidden="true"></i>Marcar todas como leídas</button>
                </form>
            </div>

            <div class="card">
                <div class="card-body p-4">
                    <p th:if="${#lists.isEmpty(notificaciones)}" class="lista-vacia mb-0">No tienes notificaciones.</p>
                    <ul class="lista-notificaciones" th:unless="${#lists.isEmpty(notificaciones)}">
                        <li th:each="n : ${notificaciones}" th:classappend="${n.leida} ? 'leida'">
                            <span class="punto-no-leida" aria-hidden="true"></span>
                            <div>
                                <span class="visually-hidden" th:unless="${n.leida}">Sin leer:</span>
                                <span th:text="${n.mensaje}">Mensaje</span>
                                <div class="small">
                                    <span class="text-muted numero" th:text="${#temporals.format(n.fecha, 'dd/MM/yyyy HH:mm')}">01/10/2026</span>
                                    <a th:if="${n.transaccion != null}" class="ms-2" th:href="@{/transacciones/{id}(id=${n.transaccion.id})}">Ver trato</a>
                                </div>
                            </div>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</main>

</body>
</html>
