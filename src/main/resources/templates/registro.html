<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear cuenta | TratoSeguro EC</title>
    <link rel="icon" type="image/png" th:href="@{/img/icono.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body class="auth-fondo d-flex align-items-center">

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-sm-10 col-md-7 col-lg-5">
            <div class="card shadow">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <img th:src="@{/img/logo.png}" alt="TratoSeguro EC" class="img-fluid logo-auth">
                        <h1 class="h5 titulo mt-3 mb-0">Crear cuenta</h1>
                    </div>

                    <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></div>

                    <form th:action="@{/registro}" method="post">
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre completo</label>
                            <input type="text" id="nombre" name="nombre" class="form-control" th:value="${param.nombre}" required>
                        </div>
                        <div class="mb-3">
                            <label for="username" class="form-label">Usuario</label>
                            <input type="text" id="username" name="username" class="form-control" th:value="${param.username}" required>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label">Contraseña (mínimo 6 caracteres)</label>
                            <input type="password" id="password" name="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Registrarme</button>
                    </form>
                </div>
                <div class="card-footer bg-white text-center small py-3">
                    ¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión</a>
                </div>
            </div>
        </div>
    </div>
</main>

</body>
</html>
