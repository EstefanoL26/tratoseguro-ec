<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/base :: head('Usuarios')}"></head>
<body class="app">

<th:block th:replace="~{fragmentos/base :: navbar('usuarios')}"></th:block>

<div class="contenido-envoltura">
<main class="contenido">
    <th:block th:replace="~{fragmentos/base :: alertas}"></th:block>

    <header class="cabecera">
        <div>
            <ol class="migas" aria-label="Ubicación">
                <li><a th:href="@{/transacciones}">Inicio</a></li>
                <li aria-current="page">Usuarios</li>
            </ol>
            <h1 class="titulo">Usuarios</h1>
            <p class="subtitulo">Compradores, vendedores, mediadores y personal que participa en los tratos.</p>
        </div>
        <a th:href="@{/admin/usuarios/nuevo}" class="btn btn-primary"><i class="bi bi-person-plus" aria-hidden="true"></i>Nuevo usuario</a>
    </header>

    <section class="panel" aria-labelledby="titulo-usuarios">
        <div class="panel-cabecera">
            <h2 id="titulo-usuarios" class="panel-titulo">Personas registradas <span class="cuenta" th:text="${#lists.size(usuarios)}">5</span></h2>
            <form th:action="@{/admin/usuarios}" method="get" role="search" class="buscador-panel d-flex gap-2 flex-grow-1 justify-content-end">
                <label for="buscar" class="visually-hidden">Buscar por nombre, usuario o cédula</label>
                <div class="buscador flex-grow-1">
                    <i class="bi bi-search" aria-hidden="true"></i>
                    <input type="search" id="buscar" name="buscar" th:value="${buscar}" class="form-control"
                           placeholder="Nombre, usuario o cédula">
                </div>
                <a th:if="${buscar}" th:href="@{/admin/usuarios}" class="btn btn-outline-secondary">Limpiar</a>
            </form>
        </div>

        <!-- En móvil cada fila se muestra como tarjeta (ver .tabla-tarjetas en estilos.css) -->
        <div class="table-responsive">
            <table class="table table-hover tabla tabla-tarjetas">
                <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Usuario</th>
                    <th>Cédula</th>
                    <th>Rol</th>
                    <th>Ciudad</th>
                    <th class="text-end"><span class="visually-hidden">Acciones</span></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="u : ${usuarios}">
                    <td class="celda-principal">
                        <span th:replace="~{fragmentos/base :: persona(${u.nombre}, ${u.email})}"></span>
                    </td>
                    <td data-label="Usuario" th:text="${u.username}">usuario</td>
                    <td data-label="Cédula" class="numero" th:text="${u.cedula}">1712345675</td>
                    <td data-label="Rol">
                        <span class="etiqueta"
                              th:classappend="${u.rol.name() == 'COMPRADOR'} ? 'etiqueta-azul' : (${u.rol.name() == 'VENDEDOR'} ? 'etiqueta-turquesa' : (${u.rol.name() == 'MEDIADOR'} ? 'etiqueta-ambar' : (${u.rol.name() == 'FINANZAS'} ? 'etiqueta-verde' : '')))"
                              th:text="${u.rol.descripcion}">Rol</span>
                    </td>
                    <td data-label="Ciudad">
                        <span th:if="${u.ciudad != null}">
                            <span th:text="${u.ciudad.nombre}">Quito</span>
                            <span class="celda-secundaria" th:text="${u.ciudad.provincia.nombre}">Pichincha</span>
                        </span>
                        <span th:if="${u.ciudad == null}" class="text-muted">Sin ciudad</span>
                    </td>
                    <td class="text-end text-nowrap celda-acciones">
                        <div class="d-inline-flex gap-2">
                            <a th:href="@{/admin/usuarios/editar/{id}(id=${u.id})}" class="btn btn-sm btn-outline-secondary"
                               th:aria-label="'Editar a ' + ${u.nombre}"><i class="bi bi-pencil" aria-hidden="true"></i>Editar</a>
                            <form th:if="${u.username != usuarioActual}" th:action="@{/admin/usuarios/eliminar/{id}(id=${u.id})}"
                                  method="post" onsubmit="return confirm('¿Seguro que deseas eliminar este usuario?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger"
                                        th:aria-label="'Eliminar a ' + ${u.nombre}"><i class="bi bi-trash3" aria-hidden="true"></i>Eliminar</button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(usuarios)}">
                    <td colspan="6" class="celda-vacia">
                        <div class="vacio">
                            <i class="bi bi-people" aria-hidden="true"></i>
                            <strong th:text="${buscar} ? 'Ningún usuario coincide con la búsqueda' : 'Todavía no hay usuarios registrados'">Sin usuarios</strong>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</div>

</body>
</html>
