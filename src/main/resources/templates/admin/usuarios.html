<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Usuarios | TratoSeguro EC</title>
    <link rel="icon" type="image/png" th:href="@{/img/icono.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-ts shadow-sm">
    <div class="container">
        <a class="navbar-brand" th:href="@{/transacciones}">
            <img th:src="@{/img/logo.png}" alt="TratoSeguro EC" class="logo-navbar">
        </a>
        <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" th:href="@{/transacciones}">Mis tratos</a></li>
            <li class="nav-item"><a class="nav-link active" th:href="@{/admin/usuarios}">Administración</a></li>
        </ul>
        <span class="navbar-text me-3" th:text="${usuarioActual}">admin</span>
        <form th:action="@{/logout}" method="post" class="d-flex">
            <button type="submit" class="btn btn-sm btn-outline-secondary">Cerrar sesión</button>
        </form>
    </div>
</nav>

<main class="container py-4">
    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h1 class="h3 titulo mb-0">Usuarios</h1>
            <small class="text-muted">Compradores, vendedores, mediadores y personal que participa en los tratos</small>
        </div>
        <a th:href="@{/admin/usuarios/nuevo}" class="btn btn-primary">+ Nuevo usuario</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form th:action="@{/admin/usuarios}" method="get" class="row g-2 mb-3">
                <div class="col-sm-8 col-md-6">
                    <input type="text" name="buscar" th:value="${buscar}" class="form-control"
                           placeholder="Buscar por nombre, usuario o cédula">
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-outline-primary">Buscar</button>
                    <a th:if="${buscar}" th:href="@{/admin/usuarios}" class="btn btn-outline-secondary">Limpiar</a>
                </div>
            </form>

            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>#</th>
                        <th>Nombre</th>
                        <th>Usuario</th>
                        <th>Cédula</th>
                        <th>Rol</th>
                        <th>Ciudad</th>
                        <th class="text-end">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="u : ${usuarios}">
                        <td th:text="${u.id}">1</td>
                        <td>
                            <div class="fw-semibold" th:text="${u.nombre}">Nombre</div>
                            <small class="text-muted" th:text="${u.email}">correo</small>
                        </td>
                        <td th:text="${u.username}">usuario</td>
                        <td th:text="${u.cedula}">1712345675</td>
                        <td><span class="badge text-bg-primary" th:text="${u.rol.descripcion}">Rol</span></td>
                        <td>
                            <th:block th:if="${u.ciudad != null}">
                                <span th:text="${u.ciudad.nombre}">Quito</span>
                                <small class="text-muted d-block" th:text="${u.ciudad.provincia.nombre}">Pichincha</small>
                            </th:block>
                            <span th:if="${u.ciudad == null}" class="text-muted">Sin ciudad</span>
                        </td>
                        <td class="text-end text-nowrap">
                            <a th:href="@{/admin/usuarios/editar/{id}(id=${u.id})}" class="btn btn-sm btn-outline-primary">Editar</a>
                            <form th:if="${u.username != usuarioActual}" th:action="@{/admin/usuarios/eliminar/{id}(id=${u.id})}"
                                  method="post" class="d-inline"
                                  onsubmit="return confirm('¿Seguro que deseas eliminar este usuario?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(usuarios)}">
                        <td colspan="7" class="text-center text-muted py-4">No hay usuarios para mostrar.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

</body>
</html>
