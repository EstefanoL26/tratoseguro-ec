<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Usuario | TratoSeguro EC</title>
    <link rel="icon" type="image/png" th:href="@{/img/icono.png}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-ts shadow-sm">
    <div class="container">
        <a class="navbar-brand" th:href="@{/transacciones}">
            <img th:src="@{/img/logo.png}" alt="TratoSeguro EC" class="logo-navbar" width="145" height="38">
        </a>
        <!-- En pantallas pequeñas el menú se pliega detrás de este botón -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
                aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menú">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/transacciones}">Mis tratos</a></li>
                <li class="nav-item"><a class="nav-link active" aria-current="page" th:href="@{/admin/usuarios}">Administración</a></li>
            </ul>
            <div class="navbar-usuario">
                <span class="navbar-text"><i class="bi bi-person-circle me-1" aria-hidden="true"></i><span th:text="${usuarioActual}">admin</span></span>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-sm btn-outline-secondary"><i class="bi bi-box-arrow-right" aria-hidden="true"></i>Cerrar sesión</button>
                </form>
            </div>
        </div>
    </div>
</nav>

<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card">
                <div class="card-body p-4">
                    <h1 class="titulo mb-4" th:text="${usuario.id == null} ? 'Nuevo usuario' : 'Editar usuario #' + ${usuario.id}">Usuario</h1>

                    <!-- novalidate: a propósito no validamos con el navegador; todo se valida en el servidor.
                         Cada error se conecta a su campo con aria-describedby para los lectores de pantalla. -->
                    <form th:action="@{/admin/usuarios/guardar}" th:object="${usuario}" method="post" novalidate>
                        <input type="hidden" th:field="*{id}">

                        <!-- Errores que no son de un campo en particular (por ejemplo la contraseña) -->
                        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger py-2" role="alert">
                            <div th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
                        </div>

                        <fieldset class="grupo-campos">
                            <legend>Datos personales</legend>
                            <div class="row">
                                <div class="col-md-7 mb-3">
                                    <label for="nombre" class="form-label">Nombre completo *</label>
                                    <input type="text" th:field="*{nombre}" class="form-control" autocomplete="name"
                                           th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'"
                                           th:aria-invalid="${#fields.hasErrors('nombre')} ? 'true' : null"
                                           th:aria-describedby="${#fields.hasErrors('nombre')} ? 'nombre-error' : null">
                                    <div id="nombre-error" class="invalid-feedback" th:errors="*{nombre}"></div>
                                </div>
                                <div class="col-md-5 mb-3">
                                    <label for="cedula" class="form-label">Cédula *</label>
                                    <input type="text" th:field="*{cedula}" class="form-control" maxlength="10" inputmode="numeric"
                                           th:classappend="${#fields.hasErrors('cedula')} ? 'is-invalid'"
                                           th:aria-invalid="${#fields.hasErrors('cedula')} ? 'true' : null"
                                           th:aria-describedby="${#fields.hasErrors('cedula')} ? 'cedula-error cedula-ayuda' : 'cedula-ayuda'">
                                    <div id="cedula-error" class="invalid-feedback" th:errors="*{cedula}"></div>
                                    <div id="cedula-ayuda" class="form-text">Se valida en el servidor con el dígito verificador.</div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-7 mb-3">
                                    <label for="email" class="form-label">Correo *</label>
                                    <input type="email" th:field="*{email}" class="form-control" autocomplete="email"
                                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                                           th:aria-invalid="${#fields.hasErrors('email')} ? 'true' : null"
                                           th:aria-describedby="${#fields.hasErrors('email')} ? 'email-error' : null">
                                    <div id="email-error" class="invalid-feedback" th:errors="*{email}"></div>
                                </div>
                            </div>
                        </fieldset>

                        <fieldset class="grupo-campos">
                            <legend>Acceso al sistema</legend>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="username" class="form-label">Usuario *</label>
                                    <input type="text" th:field="*{username}" class="form-control" autocomplete="off"
                                           th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'"
                                           th:aria-invalid="${#fields.hasErrors('username')} ? 'true' : null"
                                           th:aria-describedby="${#fields.hasErrors('username')} ? 'username-error' : null">
                                    <div id="username-error" class="invalid-feedback" th:errors="*{username}"></div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="clave" class="form-label" th:text="${usuario.id == null} ? 'Contraseña *' : 'Nueva contraseña'">Contraseña</label>
                                    <input type="password" id="clave" name="clave" class="form-control" autocomplete="new-password"
                                           th:aria-describedby="${usuario.id != null} ? 'clave-ayuda' : null">
                                    <div id="clave-ayuda" class="form-text" th:if="${usuario.id != null}">Déjala vacía para mantener la actual.</div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="rol" class="form-label">Rol *</label>
                                    <select th:field="*{rol}" class="form-select"
                                            th:classappend="${#fields.hasErrors('rol')} ? 'is-invalid'"
                                            th:aria-invalid="${#fields.hasErrors('rol')} ? 'true' : null"
                                            th:aria-describedby="${#fields.hasErrors('rol')} ? 'rol-error' : null">
                                        <option th:each="r : ${roles}" th:value="${r}" th:text="${r.descripcion}">Rol</option>
                                    </select>
                                    <div id="rol-error" class="invalid-feedback" th:errors="*{rol}"></div>
                                </div>
                            </div>
                        </fieldset>

                        <fieldset class="grupo-campos">
                            <legend>Ubicación</legend>
                            <!-- Dropdown dependiente: al escoger la provincia se cargan solo sus ciudades -->
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="provincia" class="form-label">Provincia *</label>
                                    <select id="provincia" name="provinciaId" class="form-select">
                                        <option value="">-- Escoge la provincia --</option>
                                        <option th:each="p : ${provincias}" th:value="${p.id}" th:text="${p.nombre}"
                                                th:selected="${p.id == provinciaId}">Provincia</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="ciudad" class="form-label">Ciudad *</label>
                                    <select id="ciudad" name="ciudadId" class="form-select"
                                            th:classappend="${#fields.hasErrors('ciudad')} ? 'is-invalid'"
                                            th:aria-invalid="${#fields.hasErrors('ciudad')} ? 'true' : null"
                                            th:aria-describedby="${#fields.hasErrors('ciudad')} ? 'ciudad-error' : null">
                                        <option value="" th:text="${#lists.isEmpty(ciudades)} ? '-- Primero escoge la provincia --' : '-- Escoge la ciudad --'"></option>
                                        <option th:each="c : ${ciudades}" th:value="${c.id}" th:text="${c.nombre}"
                                                th:selected="${c.id == ciudadId}">Ciudad</option>
                                    </select>
                                    <div id="ciudad-error" class="invalid-feedback" th:errors="*{ciudad}"></div>
                                </div>
                            </div>
                        </fieldset>

                        <div class="d-flex justify-content-end gap-2 mt-3">
                            <a th:href="@{/admin/usuarios}" class="btn btn-outline-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-primary">Guardar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<script th:inline="javascript">
    // Al cambiar la provincia se piden al servidor sus ciudades y se vuelve a llenar el dropdown de ciudades
    const urlCiudades = /*[[@{/admin/usuarios/ciudades}]]*/ '/admin/usuarios/ciudades';
    const selectProvincia = document.getElementById('provincia');
    const selectCiudad = document.getElementById('ciudad');

    selectProvincia.addEventListener('change', async function () {
        selectCiudad.innerHTML = '';
        if (!this.value) {
            selectCiudad.add(new Option('-- Primero escoge la provincia --', ''));
            return;
        }
        selectCiudad.add(new Option('-- Escoge la ciudad --', ''));
        const respuesta = await fetch(urlCiudades + '?provinciaId=' + this.value);
        const ciudades = await respuesta.json();
        ciudades.forEach(c => selectCiudad.add(new Option(c.nombre, c.id)));
    });
</script>
</body>
</html>
