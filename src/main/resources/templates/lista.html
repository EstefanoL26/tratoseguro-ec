<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mis tratos | TratoSeguro EC</title>
    <link rel="icon" type="image/png" th:href="@{/img/icono.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-ts shadow-sm">
    <div class="container">
        <a class="navbar-brand" th:href="@{/transacciones}">
            <img th:src="@{/img/logo.png}" alt="TratoSeguro EC" class="logo-navbar">
        </a>
        <!-- En pantallas pequeñas el menú se pliega detrás de este botón -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
                aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menú">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link active" aria-current="page" th:href="@{/transacciones}">Mis tratos</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/transacciones/nueva}">Nuevo trato</a></li>
                <!-- Solo el administrador ve este menú (la protección real está en SecurityConfig) -->
                <li class="nav-item" th:if="${esAdmin}"><a class="nav-link" th:href="@{/admin/usuarios}">Administración</a></li>
            </ul>
            <div class="navbar-usuario">
                <span class="navbar-text" th:text="${usuarioActual}">usuario</span>
                <!-- El logout es POST para que lleve el token CSRF (th:action lo agrega solo) -->
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-sm btn-outline-secondary">Cerrar sesión</button>
                </form>
            </div>
        </div>
    </div>
</nav>

<main class="container py-4">
    <div th:if="${mensaje}" class="alert alert-success" role="status" th:text="${mensaje}"></div>
    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

    <div class="encabezado-pagina">
        <h1 class="h3 titulo mb-0">Mis tratos</h1>
        <a th:href="@{/transacciones/nueva}" class="btn btn-primary">+ Nuevo trato</a>
    </div>

    <div class="card shadow-sm card-listado">
        <div class="card-body">
            <form th:action="@{/transacciones}" method="get" class="row g-2 mb-3" role="search">
                <div class="col-sm-8 col-md-6">
                    <label for="buscar" class="visually-hidden">Buscar por producto</label>
                    <input type="search" id="buscar" name="buscar" th:value="${buscar}" class="form-control"
                           placeholder="Buscar por producto">
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-outline-primary">Buscar</button>
                    <a th:if="${buscar}" th:href="@{/transacciones}" class="btn btn-outline-secondary">Limpiar</a>
                </div>
            </form>

            <!-- En móvil cada fila se muestra como tarjeta (ver .tabla-tarjetas en estilos.css) -->
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0 tabla-tarjetas">
                    <thead class="table-light">
                    <tr>
                        <th class="col-id">#</th>
                        <th>Producto</th>
                        <th>Vendedor</th>
                        <th>Comprador</th>
                        <th class="text-end">Monto</th>
                        <th class="text-center">Entrega</th>
                        <th>Estado</th>
                        <th class="text-end">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="t : ${transacciones}">
                        <td class="col-id" th:text="${t.id}">1</td>
                        <td class="celda-principal">
                            <div class="fw-semibold" th:text="${t.producto}">Producto</div>
                            <small class="text-muted" th:text="${t.descripcion}">Descripción</small>
                        </td>
                        <td data-label="Vendedor" th:text="${t.vendedor}">Vendedor</td>
                        <td data-label="Comprador" th:text="${t.emailComprador}">correo</td>
                        <td data-label="Monto" class="text-end" th:text="'$ ' + ${#numbers.formatDecimal(t.monto, 1, 'POINT', 2, 'COMMA')}">$ 0,00</td>
                        <td data-label="Entrega" class="text-center" th:text="${t.diasEntrega} + ' días'">5 días</td>
                        <td data-label="Estado"><span class="badge text-bg-info" th:text="${t.estado}">CREADA</span></td>
                        <td class="text-end text-nowrap celda-acciones">
                            <th:block th:if="${t.editable}">
                                <a th:href="@{/transacciones/editar/{id}(id=${t.id})}" class="btn btn-sm btn-outline-primary btn-accion"
                                   th:aria-label="'Editar ' + ${t.producto}">Editar</a>
                                <form th:action="@{/transacciones/eliminar/{id}(id=${t.id})}" method="post" class="d-inline"
                                      onsubmit="return confirm('¿Seguro que deseas eliminar este trato?');">
                                    <button type="submit" class="btn btn-sm btn-outline-danger btn-accion"
                                            th:aria-label="'Eliminar ' + ${t.producto}">Eliminar</button>
                                </form>
                            </th:block>
                            <span th:unless="${t.editable}" class="badge text-bg-secondary">Bloqueada</span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(transacciones)}">
                        <td colspan="8" class="text-center text-muted py-4 celda-vacia">No hay tratos para mostrar.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

</body>
</html>
