<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mis tratos | TratoSeguro EC</title>
    <link rel="icon" type="image/png" th:href="@{/img/icono.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-ts shadow-sm">
    <div class="container">
        <a class="navbar-brand" th:href="@{/transacciones}">
            <img th:src="@{/img/logo.png}" alt="TratoSeguro EC" class="logo-navbar">
        </a>
        <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link active" th:href="@{/transacciones}">Mis tratos</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/transacciones/nueva}">Nuevo trato</a></li>
        </ul>
    </div>
</nav>

<main class="container py-4">
    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 titulo mb-0">Mis tratos</h1>
        <a th:href="@{/transacciones/nueva}" class="btn btn-primary">+ Nuevo trato</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form th:action="@{/transacciones}" method="get" class="row g-2 mb-3">
                <div class="col-sm-8 col-md-6">
                    <input type="text" name="buscar" th:value="${buscar}" class="form-control"
                           placeholder="Buscar por producto">
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-outline-primary">Buscar</button>
                    <a th:if="${buscar}" th:href="@{/transacciones}" class="btn btn-outline-secondary">Limpiar</a>
                </div>
            </form>

            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>#</th>
                        <th>Producto</th>
                        <th>Vendedor</th>
                        <th>Comprador</th>
                        <th class="text-end">Monto</th>
                        <th class="text-center">Entrega</th>
                        <th>Estado</th>
                        <th class="text-end">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="t : ${transacciones}">
                        <td th:text="${t.id}">1</td>
                        <td>
                            <div class="fw-semibold" th:text="${t.producto}">Producto</div>
                            <small class="text-muted" th:text="${t.descripcion}">Descripción</small>
                        </td>
                        <td th:text="${t.vendedor}">Vendedor</td>
                        <td th:text="${t.emailComprador}">correo</td>
                        <td class="text-end" th:text="'$ ' + ${#numbers.formatDecimal(t.monto, 1, 'POINT', 2, 'COMMA')}">$ 0,00</td>
                        <td class="text-center" th:text="${t.diasEntrega} + ' días'">5 días</td>
                        <td><span class="badge text-bg-info" th:text="${t.estado}">CREADA</span></td>
                        <td class="text-end text-nowrap">
                            <th:block th:if="${t.editable}">
                                <a th:href="@{/transacciones/editar/{id}(id=${t.id})}" class="btn btn-sm btn-outline-primary">Editar</a>
                                <form th:action="@{/transacciones/eliminar/{id}(id=${t.id})}" method="post" class="d-inline"
                                      onsubmit="return confirm('¿Seguro que deseas eliminar este trato?');">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
                                </form>
                            </th:block>
                            <span th:unless="${t.editable}" class="badge text-bg-secondary">Bloqueada</span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(transacciones)}">
                        <td colspan="8" class="text-center text-muted py-4">No hay tratos para mostrar.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
