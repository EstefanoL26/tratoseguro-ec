<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!-- Piezas que se repiten en todas las páginas internas. Se insertan con th:replace. -->

<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#edf2f7">
    <title th:text="${titulo} + ' | TratoSeguro EC'">TratoSeguro EC</title>
    <link rel="icon" type="image/png" th:href="@{/img/icono.png}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script th:src="@{/js/interacciones.js}" defer></script>
    <!-- Sin JavaScript el toast se muestra fijo, sin animación -->
    <noscript><style>.t-toast { opacity: 1; transform: none; filter: none; }</style></noscript>
</head>

<!-- Menú de la aplicación: barra lateral fija en computadora y panel desplegable en el celular.
     Cada rol ve sus secciones; "activo" marca la sección actual. -->
<th:block th:fragment="navbar(activo)">
    <!-- Barra superior: solo en pantallas pequeñas -->
    <header class="barra-movil d-lg-none">
        <button class="btn btn-outline-secondary btn-icono" type="button" data-bs-toggle="offcanvas"
                data-bs-target="#menuLateral" aria-controls="menuLateral" aria-label="Abrir menú">
            <i class="bi bi-list" aria-hidden="true"></i>
        </button>
        <a th:href="@{/transacciones}" class="me-auto">
            <img th:src="@{/img/logo.png}" alt="TratoSeguro EC" width="124" height="32">
        </a>
        <a class="campana" th:href="@{/notificaciones}"
           th:attr="aria-label=${notificacionesNoLeidas > 0} ? 'Notificaciones: ' + ${notificacionesNoLeidas} + ' sin leer' : 'Notificaciones'">
            <i class="bi bi-bell" aria-hidden="true"></i>
            <span th:if="${notificacionesNoLeidas > 0}" class="campana-contador"
                  th:text="${notificacionesNoLeidas > 99} ? '99+' : ${notificacionesNoLeidas}" aria-hidden="true">3</span>
        </a>
    </header>

    <aside class="lateral offcanvas-lg offcanvas-start" id="menuLateral" tabindex="-1" aria-label="Menú principal">
        <div class="d-flex align-items-center">
            <a class="lateral-marca" th:href="@{/transacciones}">
                <img th:src="@{/img/logo.png}" alt="TratoSeguro EC" width="150" height="39">
            </a>
            <button type="button" class="btn-close ms-auto me-3 d-lg-none" data-bs-dismiss="offcanvas"
                    data-bs-target="#menuLateral" aria-label="Cerrar menú"></button>
        </div>

        <nav class="lateral-seccion" aria-label="Secciones">
            <p class="lateral-titulo">Principal</p>
            <ul class="lateral-menu">
                <li>
                    <a class="lateral-enlace" th:classappend="${activo == 'tratos'} ? 'activo'"
                       th:attr="aria-current=${activo == 'tratos'} ? 'page' : null" th:href="@{/transacciones}">
                        <i class="bi bi-arrow-left-right" aria-hidden="true"></i>Tratos
                    </a>
                </li>
                <li th:if="${esVendedorActual}">
                    <a class="lateral-enlace" th:classappend="${activo == 'nuevo'} ? 'activo'"
                       th:attr="aria-current=${activo == 'nuevo'} ? 'page' : null" th:href="@{/transacciones/nueva}">
                        <i class="bi bi-plus-circle" aria-hidden="true"></i>Nuevo trato
                    </a>
                </li>
                <li>
                    <a class="lateral-enlace" th:classappend="${activo == 'notificaciones'} ? 'activo'"
                       th:attr="aria-current=${activo == 'notificaciones'} ? 'page' : null" th:href="@{/notificaciones}">
                        <i class="bi bi-bell" aria-hidden="true"></i>Notificaciones
                        <span th:if="${notificacionesNoLeidas > 0}" class="lateral-contador"
                              th:text="${notificacionesNoLeidas > 99} ? '99+' : ${notificacionesNoLeidas}">3</span>
                        <span th:if="${notificacionesNoLeidas > 0}" class="visually-hidden">sin leer</span>
                    </a>
                </li>
            </ul>

            <th:block th:if="${esMediador or esFinanzas}">
                <p class="lateral-titulo">Gestión</p>
                <ul class="lateral-menu">
                    <li th:if="${esMediador}">
                        <a class="lateral-enlace" th:classappend="${activo == 'disputas'} ? 'activo'"
                           th:attr="aria-current=${activo == 'disputas'} ? 'page' : null" th:href="@{/disputas}">
                            <i class="bi bi-shield-exclamation" aria-hidden="true"></i>Disputas
                        </a>
                    </li>
                    <li th:if="${esFinanzas}">
                        <a class="lateral-enlace" th:classappend="${activo == 'finanzas'} ? 'activo'"
                           th:attr="aria-current=${activo == 'finanzas'} ? 'page' : null" th:href="@{/finanzas}">
                            <i class="bi bi-safe" aria-hidden="true"></i>Finanzas
                        </a>
                    </li>
                </ul>
            </th:block>

            <th:block th:if="${esAdmin}">
                <p class="lateral-titulo">Administración</p>
                <ul class="lateral-menu">
                    <li>
                        <a class="lateral-enlace" th:classappend="${activo == 'usuarios'} ? 'activo'"
                           th:attr="aria-current=${activo == 'usuarios'} ? 'page' : null" th:href="@{/admin/usuarios}">
                            <i class="bi bi-people" aria-hidden="true"></i>Usuarios
                        </a>
                    </li>
                    <li>
                        <a class="lateral-enlace" th:classappend="${activo == 'feriados'} ? 'activo'"
                           th:attr="aria-current=${activo == 'feriados'} ? 'page' : null" th:href="@{/admin/feriados}">
                            <i class="bi bi-calendar-event" aria-hidden="true"></i>Feriados
                        </a>
                    </li>
                </ul>
            </th:block>
        </nav>

        <div class="lateral-prueba">
            <strong><i class="bi bi-cone-striped" aria-hidden="true"></i>Modo de prueba</strong>
            Los pagos son de prueba: no se mueve dinero real.
        </div>

        <div class="lateral-usuario">
            <div class="tarjeta-usuario">
                <span th:replace="~{fragmentos/base :: avatar(${nombreActual}, '')}"></span>
                <div class="tarjeta-usuario-datos">
                    <span class="tarjeta-usuario-nombre" th:text="${nombreActual}">Usuario</span>
                    <span class="tarjeta-usuario-rol" th:text="${rolActual?.descripcion}">Rol</span>
                </div>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-salir" aria-label="Cerrar sesión" title="Cerrar sesión">
                        <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
                    </button>
                </form>
            </div>
        </div>
    </aside>
</th:block>

<!-- Mensajes: los errores quedan fijos (hay que leerlos); las confirmaciones salen como toast -->
<th:block th:fragment="alertas">
    <div th:if="${error}" class="aviso aviso-alerta mb-4" role="alert">
        <i class="bi bi-exclamation-circle" aria-hidden="true"></i><span th:text="${error}">Error</span>
    </div>
    <div th:if="${mensaje}" class="toast-zona" role="status" aria-live="polite">
        <div class="t-toast toast-ts">
            <i class="bi bi-check-circle-fill toast-icono" aria-hidden="true"></i>
            <span th:text="${mensaje}">Guardado</span>
            <button type="button" class="btn-close ms-auto" aria-label="Cerrar aviso" data-cerrar-toast></button>
        </div>
    </div>
</th:block>

<!-- Etiqueta de estado del trato: cada estado tiene su color (estilos.css) y siempre su nombre -->
<span th:fragment="estado(e)" class="estado" th:classappend="'estado-' + ${#strings.toLowerCase(e.name())}"
      th:text="${e.descripcion}">Creada</span>

<!-- Dinero con formato ecuatoriano: $ 1.250,00 -->
<span th:fragment="dinero(valor)" class="monto"
      th:text="${valor == null} ? '—' : '$ ' + ${#numbers.formatDecimal(valor, 1, 'POINT', 2, 'COMMA')}">$ 0,00</span>

<!-- Avatar con las iniciales del nombre (el color cambia según el nombre para distinguir personas) -->
<span th:fragment="avatar(nombre, tamano)" class="avatar" aria-hidden="true"
      th:with="partes=${#strings.arraySplit(nombre, ' ')}"
      th:classappend="${tamano} + ' avatar-' + ${nombre.length() % 4}"
      th:text="${#strings.toUpperCase(#strings.substring(partes[0], 0, 1) + (partes.length > 1 ? #strings.substring(partes[1], 0, 1) : ''))}">AT</span>

<!-- Persona: avatar + nombre (+ dato secundario opcional) -->
<span th:fragment="persona(nombre, detalle)" class="persona">
    <span th:replace="~{fragmentos/base :: avatar(${nombre}, '')}"></span>
    <span class="text-truncate">
        <span class="fw-semibold" th:text="${nombre}">Ana Torres</span>
        <span th:if="${detalle != null}" class="celda-secundaria" th:text="${detalle}">Comprador</span>
    </span>
</span>

<!-- Ícono de cada estado (historial y notificaciones) -->
<i th:fragment="icono-estado(e)" class="bi" aria-hidden="true"
   th:classappend="${e.name() == 'CREADA'} ? 'bi-file-earmark-plus' :
                   (${e.name() == 'PAGADA'} ? 'bi-safe' :
                   (${e.name() == 'ENVIADA'} ? 'bi-truck' :
                   (${e.name() == 'LIBERADA'} ? 'bi-check2-circle' :
                   (${e.name() == 'EN_DISPUTA'} ? 'bi-shield-exclamation' :
                   (${e.name() == 'REEMBOLSADA'} ? 'bi-arrow-counterclockwise' : 'bi-x-circle')))))"></i>

</html>
