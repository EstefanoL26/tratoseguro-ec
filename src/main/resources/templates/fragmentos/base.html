<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!-- Piezas que se repiten en todas las páginas internas. Se insertan con th:replace. -->

<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' | TratoSeguro EC'">TratoSeguro EC</title>
    <link rel="icon" type="image/png" th:href="@{/img/icono.png}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script th:src="@{/js/interacciones.js}" defer></script>
    <!-- Sin JavaScript el toast se muestra fijo, sin animación -->
    <noscript><style>.t-toast { opacity: 1; transform: none; filter: none; }</style></noscript>
</head>

<!-- Barra de navegación: cada rol ve sus secciones. "activo" marca la sección actual. -->
<nav th:fragment="navbar(activo)" class="navbar navbar-expand-lg navbar-ts shadow-sm">
    <div class="container">
        <a class="navbar-brand" th:href="@{/transacciones}">
            <img th:src="@{/img/logo.png}" alt="TratoSeguro EC" class="logo-navbar" width="145" height="38">
        </a>
        <!-- En pantallas pequeñas el menú se pliega detrás de este botón -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
                aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menú">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activo == 'tratos'} ? 'active'"
                       th:attr="aria-current=${activo == 'tratos'} ? 'page' : null" th:href="@{/transacciones}">Tratos</a>
                </li>
                <li class="nav-item" th:if="${esVendedorActual}">
                    <a class="nav-link" th:classappend="${activo == 'nuevo'} ? 'active'"
                       th:attr="aria-current=${activo == 'nuevo'} ? 'page' : null" th:href="@{/transacciones/nueva}">Nuevo trato</a>
                </li>
                <li class="nav-item" th:if="${esVendedorActual}">
                    <a class="nav-link" th:classappend="${activo == 'cobros'} ? 'active'"
                       th:attr="aria-current=${activo == 'cobros'} ? 'page' : null" th:href="@{/cuenta/cobros}">Cobros</a>
                </li>
                <li class="nav-item" th:if="${esMediador}">
                    <a class="nav-link" th:classappend="${activo == 'disputas'} ? 'active'"
                       th:attr="aria-current=${activo == 'disputas'} ? 'page' : null" th:href="@{/disputas}">Disputas</a>
                </li>
                <li class="nav-item" th:if="${esFinanzas}">
                    <a class="nav-link" th:classappend="${activo == 'finanzas'} ? 'active'"
                       th:attr="aria-current=${activo == 'finanzas'} ? 'page' : null" th:href="@{/finanzas}">Finanzas</a>
                </li>
                <li class="nav-item" th:if="${esAdmin}">
                    <a class="nav-link" th:classappend="${activo == 'usuarios'} ? 'active'"
                       th:attr="aria-current=${activo == 'usuarios'} ? 'page' : null" th:href="@{/admin/usuarios}">Usuarios</a>
                </li>
                <li class="nav-item" th:if="${esAdmin}">
                    <a class="nav-link" th:classappend="${activo == 'feriados'} ? 'active'"
                       th:attr="aria-current=${activo == 'feriados'} ? 'page' : null" th:href="@{/admin/feriados}">Feriados</a>
                </li>
            </ul>
            <div class="navbar-usuario">
                <a class="campana" th:href="@{/notificaciones}"
                   th:attr="aria-label=${notificacionesNoLeidas > 0} ? 'Notificaciones: ' + ${notificacionesNoLeidas} + ' sin leer' : 'Notificaciones'">
                    <i class="bi bi-bell" aria-hidden="true"></i>
                    <span th:if="${notificacionesNoLeidas > 0}" class="campana-contador numero"
                          th:text="${notificacionesNoLeidas > 99} ? '99+' : ${notificacionesNoLeidas}" aria-hidden="true">3</span>
                </a>
                <span class="navbar-text">
                    <span class="fw-semibold" th:text="${nombreActual}">Usuario</span>
                    <small class="d-block rol-navbar" th:text="${rolActual?.descripcion}">Rol</small>
                </span>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-sm btn-outline-secondary">
                        <i class="bi bi-box-arrow-right" aria-hidden="true"></i>Salir
                    </button>
                </form>
            </div>
        </div>
    </div>
</nav>

<!-- Mensajes: los errores quedan fijos (hay que leerlos); las confirmaciones salen como toast -->
<th:block th:fragment="alertas">
    <div th:if="${error}" class="alert alert-danger d-flex gap-2" role="alert">
        <i class="bi bi-exclamation-circle" aria-hidden="true"></i><span th:text="${error}">Error</span>
    </div>
    <div th:if="${mensaje}" class="toast-zona" role="status" aria-live="polite">
        <div class="t-toast toast-ts">
            <i class="bi bi-check-circle-fill toast-icono" aria-hidden="true"></i>
            <span th:text="${mensaje}">Guardado</span>
            <button type="button" class="btn-close ms-auto" aria-label="Cerrar aviso" data-cerrar-toast></button>
        </div>
    </div>
</th:block>

<!-- Etiqueta de estado del trato: cada estado tiene su color (estilos.css) y siempre su nombre -->
<span th:fragment="estado(e)" class="estado" th:classappend="'estado-' + ${#strings.toLowerCase(e.name())}"
      th:text="${e.descripcion}">Creada</span>

<!-- Estrellas de 1 a 5 (llenas = valor). El texto alternativo dice la cifra exacta. -->
<span th:fragment="estrellas(valor, texto)" class="estrellas" role="img" th:attr="aria-label=${texto}">
    <i th:each="n : ${#numbers.sequence(1, 5)}" class="bi" th:classappend="${n <= valor} ? 'bi-star-fill' : 'bi-star'" aria-hidden="true"></i>
</span>

<!-- Resumen de la reputación de un vendedor: estrellas, promedio y tratos cerrados sin disputa -->
<div th:fragment="reputacion(rep, vendedor)" class="reputacion">
    <th:block th:if="${rep.sinCalificaciones}">
        <span class="text-muted">Sin calificaciones todavía</span>
    </th:block>
    <th:block th:unless="${rep.sinCalificaciones}">
        <span th:replace="~{fragmentos/base :: estrellas(${rep.estrellasLlenas}, ${'Promedio ' + rep.promedio + ' de 5'})}"></span>
        <strong class="numero" th:text="${#numbers.formatDecimal(rep.promedio, 1, 1, 'COMMA')}">4,5</strong>
        <span class="text-muted" th:text="'(' + ${rep.calificaciones} + (${rep.calificaciones == 1} ? ' calificación)' : ' calificaciones)')">(3 calificaciones)</span>
    </th:block>
    <div class="small text-muted mt-1">
        <span th:text="${rep.tratosCerrados} + (${rep.tratosCerrados == 1} ? ' trato cerrado' : ' tratos cerrados')">4 tratos cerrados</span>
        <span th:if="${rep.porcentajeSinDisputa != null}" th:text="' · ' + ${rep.porcentajeSinDisputa} + ' % sin disputa'"> · 75 % sin disputa</span>
        · <a th:href="@{/vendedores/{id}(id=${vendedor.id})}">Ver perfil</a>
    </div>
</div>

<!-- Archivo adjunto a una evidencia: miniatura (foto) o icono (PDF), tamaño y huella SHA-256 -->
<div th:fragment="archivo(info)" class="archivo-evidencia">
    <a th:href="@{/evidencias/{id}/archivo(id=${info.evidenciaId})}" target="_blank" rel="noopener" tabindex="-1" aria-hidden="true">
        <img th:if="${info.imagen}" th:src="@{/evidencias/{id}/archivo(id=${info.evidenciaId})}" alt="" loading="lazy" width="72" height="72">
        <i th:unless="${info.imagen}" class="bi bi-file-earmark-pdf icono-pdf"></i>
    </a>
    <div class="min-w-0">
        <a th:href="@{/evidencias/{id}/archivo(id=${info.evidenciaId})}" target="_blank" rel="noopener"
           class="fw-semibold text-break" th:text="${info.nombre}">foto-paquete.jpg</a>
        <div class="small text-muted">
            <span th:text="${info.imagen} ? 'Foto' : 'PDF'">Foto</span> · <span th:text="${info.tamanoLegible}">850 KB</span> ·
            <a th:href="@{/evidencias/{id}/archivo(id=${info.evidenciaId}, descargar=true)}">Descargar</a>
        </div>
        <div class="huella" th:title="'Huella SHA-256 completa: ' + ${info.sha256}"
             th:text="'SHA-256 ' + ${#strings.substring(info.sha256, 0, 16)} + '…'">SHA-256 3f9a…</div>
    </div>
</div>

<!-- Dinero con formato ecuatoriano: $ 1.250,00 -->
<span th:fragment="dinero(valor)" class="monto"
      th:text="${valor == null} ? '—' : '$ ' + ${#numbers.formatDecimal(valor, 1, 'POINT', 2, 'COMMA')}">$ 0,00</span>

</html>
