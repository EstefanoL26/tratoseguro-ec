<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!-- Piezas que se repiten en todas las páginas internas. Se insertan con th:replace. -->

<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' | TratoSeguro EC'">TratoSeguro EC</title>
    <link rel="icon" type="image/png" th:href="@{/img/icono.png}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script th:src="@{/js/interacciones.js}" defer></script>
    <!-- Sin JavaScript el toast se muestra fijo, sin animación -->
    <noscript><style>.t-toast { opacity: 1; transform: none; filter: none; }</style></noscript>
</head>

<!-- Barra de navegación: cada rol ve sus secciones. "activo" marca la sección actual. -->
<nav th:fragment="navbar(activo)" class="navbar navbar-expand-lg navbar-ts shadow-sm">
    <div class="container">
        <a class="navbar-brand" th:href="@{/transacciones}">
            <img th:src="@{/img/logo.png}" alt="TratoSeguro EC" class="logo-navbar" width="145" height="38">
        </a>
        <!-- En pantallas pequeñas el menú se pliega detrás de este botón -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
                aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menú">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activo == 'tratos'} ? 'active'"
                       th:attr="aria-current=${activo == 'tratos'} ? 'page' : null" th:href="@{/transacciones}">Tratos</a>
                </li>
                <li class="nav-item" th:if="${esVendedorActual}">
                    <a class="nav-link" th:classappend="${activo == 'nuevo'} ? 'active'"
                       th:attr="aria-current=${activo == 'nuevo'} ? 'page' : null" th:href="@{/transacciones/nueva}">Nuevo trato</a>
                </li>
                <li class="nav-item" th:if="${esMediador}">
                    <a class="nav-link" th:classappend="${activo == 'disputas'} ? 'active'"
                       th:attr="aria-current=${activo == 'disputas'} ? 'page' : null" th:href="@{/disputas}">Disputas</a>
                </li>
                <li class="nav-item" th:if="${esFinanzas}">
                    <a class="nav-link" th:classappend="${activo == 'finanzas'} ? 'active'"
                       th:attr="aria-current=${activo == 'finanzas'} ? 'page' : null" th:href="@{/finanzas}">Finanzas</a>
                </li>
                <li class="nav-item" th:if="${esAdmin}">
                    <a class="nav-link" th:classappend="${activo == 'usuarios'} ? 'active'"
                       th:attr="aria-current=${activo == 'usuarios'} ? 'page' : null" th:href="@{/admin/usuarios}">Usuarios</a>
                </li>
                <li class="nav-item" th:if="${esAdmin}">
                    <a class="nav-link" th:classappend="${activo == 'feriados'} ? 'active'"
                       th:attr="aria-current=${activo == 'feriados'} ? 'page' : null" th:href="@{/admin/feriados}">Feriados</a>
                </li>
            </ul>
            <div class="navbar-usuario">
                <a class="campana" th:href="@{/notificaciones}"
                   th:attr="aria-label=${notificacionesNoLeidas > 0} ? 'Notificaciones: ' + ${notificacionesNoLeidas} + ' sin leer' : 'Notificaciones'">
                    <i class="bi bi-bell" aria-hidden="true"></i>
                    <span th:if="${notificacionesNoLeidas > 0}" class="campana-contador numero"
                          th:text="${notificacionesNoLeidas > 99} ? '99+' : ${notificacionesNoLeidas}" aria-hidden="true">3</span>
                </a>
                <span class="navbar-text">
                    <span class="fw-semibold" th:text="${nombreActual}">Usuario</span>
                    <small class="d-block rol-navbar" th:text="${rolActual?.descripcion}">Rol</small>
                </span>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-sm btn-outline-secondary">
                        <i class="bi bi-box-arrow-right" aria-hidden="true"></i>Salir
                    </button>
                </form>
            </div>
        </div>
    </div>
</nav>

<!-- Mensajes: los errores quedan fijos (hay que leerlos); las confirmaciones salen como toast -->
<th:block th:fragment="alertas">
    <div th:if="${error}" class="alert alert-danger d-flex gap-2" role="alert">
        <i class="bi bi-exclamation-circle" aria-hidden="true"></i><span th:text="${error}">Error</span>
    </div>
    <div th:if="${mensaje}" class="toast-zona" role="status" aria-live="polite">
        <div class="t-toast toast-ts">
            <i class="bi bi-check-circle-fill toast-icono" aria-hidden="true"></i>
            <span th:text="${mensaje}">Guardado</span>
            <button type="button" class="btn-close ms-auto" aria-label="Cerrar aviso" data-cerrar-toast></button>
        </div>
    </div>
</th:block>

<!-- Etiqueta de estado del trato: cada estado tiene su color (estilos.css) y siempre su nombre -->
<span th:fragment="estado(e)" class="estado" th:classappend="'estado-' + ${#strings.toLowerCase(e.name())}"
      th:text="${e.descripcion}">Creada</span>

<!-- Dinero con formato ecuatoriano: $ 1.250,00 -->
<span th:fragment="dinero(valor)" class="monto"
      th:text="${valor == null} ? '—' : '$ ' + ${#numbers.formatDecimal(valor, 1, 'POINT', 2, 'COMMA')}">$ 0,00</span>

</html>
