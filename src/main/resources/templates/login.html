<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión | TratoSeguro EC</title>
    <link rel="icon" type="image/png" th:href="@{/img/icono.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body class="auth-fondo d-flex align-items-center">

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-sm-9 col-md-6 col-lg-4">
            <div class="card shadow">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <img th:src="@{/img/logo.png}" alt="TratoSeguro EC" class="img-fluid logo-auth">
                        <p class="text-muted mt-2 mb-0">Pago protegido para tus compras</p>
                    </div>

                    <div th:if="${param.error}" class="alert alert-danger py-2">Usuario o contraseña incorrectos.</div>
                    <div th:if="${param.logout}" class="alert alert-info py-2">Cerraste sesión correctamente.</div>
                    <div th:if="${mensaje}" class="alert alert-success py-2" th:text="${mensaje}"></div>

                    <!-- Spring Security procesa este POST. Los campos deben llamarse username y password -->
                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label">Usuario</label>
                            <input type="text" id="username" name="username" class="form-control" required autofocus>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label">Contraseña</label>
                            <input type="password" id="password" name="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Ingresar</button>
                    </form>
                </div>
                <div class="card-footer bg-white text-center small py-3">
                    ¿No tienes cuenta? <a th:href="@{/registro}">Regístrate</a>
                </div>
            </div>
        </div>
    </div>
</main>

</body>
</html>
