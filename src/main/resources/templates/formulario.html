<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trato | TratoSeguro EC</title>
    <link rel="icon" type="image/png" th:href="@{/img/icono.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-ts shadow-sm">
    <div class="container">
        <a class="navbar-brand" th:href="@{/transacciones}">
            <img th:src="@{/img/logo.png}" alt="TratoSeguro EC" class="logo-navbar">
        </a>
        <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" th:href="@{/transacciones}">Mis tratos</a></li>
            <li class="nav-item"><a class="nav-link active" th:href="@{/transacciones/nueva}">Nuevo trato</a></li>
            <!-- Solo el administrador ve este menú (la protección real está en SecurityConfig) -->
            <li class="nav-item" th:if="${esAdmin}"><a class="nav-link" th:href="@{/admin/usuarios}">Administración</a></li>
        </ul>
        <span class="navbar-text me-3" th:text="${usuarioActual}">usuario</span>
        <!-- El logout es POST para que lleve el token CSRF (th:action lo agrega solo) -->
        <form th:action="@{/logout}" method="post" class="d-flex">
            <button type="submit" class="btn btn-sm btn-outline-secondary">Cerrar sesión</button>
        </form>
    </div>
</nav>

<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h4 titulo mb-3" th:text="${transaccion.id == null} ? 'Nuevo trato' : 'Editar trato #' + ${transaccion.id}">Trato</h1>

                    <!-- El mismo formulario crea y edita: si el id oculto viene vacío, se crea -->
                    <form th:action="@{/transacciones/guardar}" th:object="${transaccion}" method="post" novalidate>
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label for="producto" class="form-label">Producto *</label>
                            <input type="text" th:field="*{producto}" class="form-control"
                                   th:classappend="${#fields.hasErrors('producto')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{producto}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="descripcion" class="form-label">Descripción</label>
                            <textarea th:field="*{descripcion}" rows="2" class="form-control"
                                      th:classappend="${#fields.hasErrors('descripcion')} ? 'is-invalid'"></textarea>
                            <div class="invalid-feedback" th:errors="*{descripcion}"></div>
                        </div>

                        <div class="row">
                            <div class="col-sm-6 mb-3">
                                <label for="monto" class="form-label">Monto ($) *</label>
                                <input type="number" step="0.01" th:field="*{monto}" class="form-control"
                                       th:classappend="${#fields.hasErrors('monto')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:errors="*{monto}"></div>
                            </div>
                            <div class="col-sm-6 mb-3">
                                <label for="diasEntrega" class="form-label">Días de entrega *</label>
                                <input type="number" step="1" th:field="*{diasEntrega}" class="form-control"
                                       th:classappend="${#fields.hasErrors('diasEntrega')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:errors="*{diasEntrega}"></div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="vendedor" class="form-label">Vendedor *</label>
                            <input type="text" th:field="*{vendedor}" class="form-control"
                                   th:classappend="${#fields.hasErrors('vendedor')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{vendedor}"></div>
                        </div>

                        <div class="mb-4">
                            <label for="emailComprador" class="form-label">Correo del comprador *</label>
                            <input type="email" th:field="*{emailComprador}" class="form-control"
                                   th:classappend="${#fields.hasErrors('emailComprador')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{emailComprador}"></div>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/transacciones}" class="btn btn-outline-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-primary">Guardar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

</body>
</html>
